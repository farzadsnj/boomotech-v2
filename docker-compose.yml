services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: boomotech
      POSTGRES_USER: boomotech
      POSTGRES_PASSWORD: boomotech
    ports:
      - "5433:5432"
    volumes:
      - boomotech_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boomotech -d boomotech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  boomotech_postgres_data:
